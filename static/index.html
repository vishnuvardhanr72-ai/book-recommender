<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageStream</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Page<span>Stream</span></div>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" autocomplete="off"
             placeholder="Describe what you want to read… e.g. a cosy adventure with dragons"
             aria-label="Describe the book you want">
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <section id="hero" class="hero" aria-live="polite"></section>

    <p id="status" class="status" role="status"></p>

    <section id="search-row" class="row" hidden>
      <h2 id="search-title" class="row-title"></h2>
      <div id="search-track" class="row-track"></div>
    </section>

    <section id="similar-row" class="row" hidden>
      <h2 id="similar-title" class="row-title"></h2>
      <div id="similar-track" class="row-track"></div>
    </section>

    <section class="row">
      <h2 class="row-title">All books</h2>
      <div id="all-track" class="row-track"></div>
    </section>
  </main>

  <dialog id="details" class="details" aria-labelledby="details-title">
    <button id="details-close" class="close" type="button" aria-label="Close">×</button>
    <div class="details-inner">
      <div id="details-cover"></div>
      <div>
        <h3 id="details-title"></h3>
        <p id="details-desc"></p>
        <h4>More like this</h4>
        <div id="details-similar" class="row-track compact"></div>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
